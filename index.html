<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParsNobix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#090a0e;color:#f0f4f8;height:100vh;overflow:hidden}
#landing{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090a0e;z-index:100}
.l-box{background:#111218;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:32px;width:380px;display:flex;flex-direction:column;gap:16px}
.l-box h1{font-size:24px;text-align:center}
.l-box p{text-align:center;color:#94a3b8;font-size:13px;margin-top:-8px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}
.field input{background:#090a0e;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 14px;color:#f0f4f8;font:inherit;font-size:14px;outline:none}
.field input:focus{border-color:#f59e0b}
.btn{padding:12px;border:none;border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:#f59e0b;color:#000}
.btn:active{transform:scale(.97)}
.btn2{background:#1a1c26;border:1px solid rgba(255,255,255,.1);color:#f0f4f8}
.sep{text-align:center;color:#5a6577;font-size:11px;text-transform:uppercase;letter-spacing:1px}
#jitsi{display:none;width:100%;height:100vh}
</style>
</head>
<body>

<div id="landing">
  <div class="l-box">
    <h1>📡 ParsNobix</h1>
    <p>Encrypted voice & screen share</p>
    <div class="field">
      <label>Name</label>
      <input type="text" id="name" placeholder="Your name" maxlength="30">
    </div>
    <button class="btn" onclick="create()">✦ Create Room</button>
    <div class="sep">or join</div>
    <div class="field">
      <label>Room code</label>
      <input type="text" id="room" placeholder="Paste code" maxlength="50">
    </div>
    <button class="btn btn2" onclick="join()">→ Join</button>
  </div>
</div>

<div id="jitsi"></div>

<audio id="ma" crossorigin="anonymous"></audio>
<input type="file" id="fi" accept="audio/*" style="display:none">

<script src="https://meet.jit.si/external_api.js"></script>
<script>
let api=null;

function create(){
  const n=document.getElementById('name').value.trim()||'Anon';
  const r='PN-'+Math.random().toString(36).slice(2,8);
  start(n,r);
}
function join(){
  const n=document.getElementById('name').value.trim()||'Anon';
  const r=document.getElementById('room').value.trim();
  if(!r)return alert('Enter room code');
  start(n,r);
}
function start(name,room){
  document.getElementById('landing').style.display='none';
  document.getElementById('jitsi').style.display='block';

  api=new JitsiMeetExternalAPI('meet.jit.si',{
    roomName:room,
    parentNode:document.getElementById('jitsi'),
    userInfo:{displayName:name},
    configOverwrite:{
      startWithAudioMuted:false,
      startWithVideoMuted:true,
      prejoinPageEnabled:false,
      disableDeepLinking:true
    },
    interfaceConfigOverwrite:{
      SHOW_JITSI_WATERMARK:false,
      SHOW_BRAND_WATERMARK:false,
      SHOW_WATERMARK_FOR_GUESTS:false,
      DEFAULT_BACKGROUND:'#090a0e'
    }
  });

  // Listen for @music in chat
  api.addEventListener('chatMessageReceived',e=>{
    const m=e.message||'';
    if(m.startsWith('@music')) doMusic(m.slice(6).trim(),e.id);
  });
  api.addEventListener('readyToClose',()=>location.reload());
}

// ── MUSIC BOT ──
function doMusic(q,id){
  if(!q)return;
  if(q==='upload'||q==='file'){document.getElementById('fi').click();return}
  if(q.match(/\.(mp3|ogg|wav|flac|m4a|aac)(\?.*)?$/i)){playUrl(q,'Shared');return}
  searchDZ(q);
}

async function searchDZ(q){
  try{
    const r=await fetch('https://api.deezer.com/search?q='+encodeURIComponent(q)+'&limit=1');
    const d=await r.json();
    if(d.data&&d.data.length>0){
      const t=d.data[0];
      playDZ(t.id,t.title,t.artist.name,t.album.cover_big);
      if(api) api.executeCommand('toggleChat');
    }
  }catch(e){}
}

function playDZ(id,title,artist,art){
  document.getElementById('deezerW')?.remove();
  const w=document.createElement('div');
  w.id='deezerW';
  w.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:200;border-radius:14px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.7);border:1px solid rgba(245,158,11,.3)';
  const f=document.createElement('iframe');
  f.src='https://widget.deezer.com/widget/dark/track/'+id+'?tracklist=false&height=80';
  f.width='300';f.height='80';f.frameBorder='0';f.allow='autoplay; encrypted-media';
  f.style.cssText='border:none;border-radius:14px';
  w.appendChild(f);
  document.body.appendChild(w);
}

function playUrl(url,title){
  const a=document.getElementById('ma');
  a.src=url;
  a.play();
}

document.getElementById('fi').onchange=e=>{
  const f=e.target.files[0];
  if(f) playUrl(URL.createObjectURL(f),f.name);
};
</script>
</body>
</html>
